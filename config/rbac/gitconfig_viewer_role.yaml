# permissions for end users to view gitconfigs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: k8sversioner
    app.kubernetes.io/managed-by: kustomize
  name: gitconfig-viewer-role
rules:
- apiGroups:
  - versioning.k8sversioner.app
  resources:
  - gitconfigs
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - versioning.k8sversioner.app
  resources:
  - gitconfigs/status
  verbs:
  - get
