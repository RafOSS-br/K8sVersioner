apiVersion: versioning.k8sversioner.app/v1alpha1
kind: Config
metadata:
  name: my-config
spec:
  scope: namespace
  namespace: default
  includeResource:
    - kind: "pod"
      version: "v1"
      group: ""
  # annotations:
  #   app.kubernetes.io/name: myApp
  # labels:
  #   app.kubernetes.io/name: myApp
  gitRef: my-gitconfig
  folderStructure: "{{ .ResourceType }}/{{ .ResourceName }}.yaml"
  excludeFieldPaths:
    - "metadata.finalizers"
    - "metadata.managedFields"
    - "status"